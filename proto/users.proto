syntax = "proto3";

package users.v1;

import "google/protobuf/empty.proto";

service UsersService {
  rpc Create(CreateUserRequest) returns (CreateUserResponse);
  rpc GetById(GetUserByIdRequest) returns (GetUserResponse);
  rpc GetByTerm(GetUsersByTermRequest) returns (GetUsersByTermResponse);
  rpc Update(UpdateUserRequest) returns (google.protobuf.Empty);
  rpc Delete(DeleteUserRequest) returns (google.protobuf.Empty);
  rpc CheckCredentials(CheckCredentialsRequest) returns (CheckCredentialsResponse);
}

message CreateUserRequest {
  string          login        = 1;
  string          password     = 2;
  optional string display_name = 3;
}

message CreateUserResponse {
  string id = 1;
}

message GetUserByIdRequest {
  string id = 1;
}

message GetUsersByTermRequest {
  string term   = 1;
  int32  limit  = 2;
  int32  offset = 3;
}

message GetUsersByTermResponse {
  repeated GetUserResponse users = 1;
}

message UpdateUserRequest {
  string          actor_id     = 1;
  string          user_id      = 2;
  optional string login        = 3;
  optional string display_name = 4;
}

message DeleteUserRequest {
  string actor_id = 1;
  string user_id  = 2;
}

message CheckCredentialsRequest {
  string login    = 1;
  string password = 2;
}

message CheckCredentialsResponse {
  bool ok = 1;
}

message GetUserResponse {
  string          login        = 1;
  optional string display_name = 2;
  Role            role         = 3;
}

enum Role {
  USER  = 0;
  PRO   = 2;
  ADMIN = 3;
}