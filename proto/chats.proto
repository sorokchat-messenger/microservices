syntax = "proto3";

package chats.v1;

import "google/protobuf/empty.proto";

service ChatsService {
  rpc CreateChat (CreateChatRequest) returns (CreateChatResponse);
  rpc UpdateChat (UpdateChatRequest) returns (google.protobuf.Empty);
  rpc DeleteChat (DeleteChatRequest) returns (google.protobuf.Empty);
  rpc GetChatById (GetChatByIdRequest) returns (GetChatByIdResponse);
  rpc GetChatsByName (GetChatsByNameRequest) returns (GetChatsByNameResponse);
  rpc AddMemberToChat (AddMemberToChatRequest) returns (google.protobuf.Empty);
  rpc RemoveMemberFromChat (RemoveMemberFromChatRequest) returns (google.protobuf.Empty);
  rpc ChangeRole (ChangeRoleRequest) returns (google.protobuf.Empty);
}

message CreateChatRequest {
  int32  actor_id    = 1;
  string name        = 2;
  string description = 3;
}

message CreateChatResponse {
  int32 id = 1;
}

message UpdateChatRequest {
  int32           id          = 1;
  optional string name        = 2;
  optional string description = 3;
}

message DeleteChatRequest {
  int32 id       = 1;
  int32 actor_id = 2;
}

message GetChatByIdRequest {
  int32 id = 1;
}

message GetChatByIdResponse {
  ChatResponse chat = 1;
}

message GetChatsByNameRequest {
  string         name   = 1;
  optional int32 limit  = 2;
  optional int32 offset = 3;
}

message GetChatsByNameResponse {
  repeated ChatResponse chats = 1;
}

message ChatResponse {
  int32                        id           = 1;
  string                       name         = 2;
  string                       description  = 3;
  repeated ParticipantResponse participants = 4;
}

message ParticipantResponse {
  int32    user_id      = 1;
  string   login        = 2;
  string   display_name = 3;
  ChatRole role         = 4;
}

enum ChatRole {
  MEMBER = 0;
  ADMIN  = 1;
}

message AddMemberToChatRequest {
  int32 chat_id  = 1;
  int32 user_id  = 2;
  int32 actor_id = 3;
}

message RemoveMemberFromChatRequest {
  int32 chat_id  = 1;
  int32 user_id  = 2;
  int32 actor_id = 3;
}

message ChangeRoleRequest {
  int32    chat_id  = 1;
  int32    user_id  = 2;
  int32    actor_id = 3;
  ChatRole role     = 4;
}